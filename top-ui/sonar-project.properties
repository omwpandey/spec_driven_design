# =============================================================================
# SonarQube Project Configuration
# Project: top-ui (tops-crm-framework)
# =============================================================================

# Source directories
sonar.sources=src
sonar.exclusions=\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/**/*.spec.ts,\
  src/**/*.spec.tsx,\
  src/tests/**,\
  src/mocks/**,\
  src/**/__tests__/**,\
  src/core/languages/en.ts,\
  src/core/languages/th.ts,\
  src/core/theme/colors.ts,\
  src/core/theme/shadows.ts,\
  src/core/theme/spacing.ts,\
  src/core/theme/typography.ts,\
  src/core/constants/**,\
  src/core/pwa/**,\
  src/vite-env.d.ts,\
  src/**/*.d.ts,\
  src/main.tsx,\
  src/App.tsx,\

# Test file detection (within sonar.sources)
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/tests/**,src/**/__tests__/**

# Coverage exclusions (files not expected to have test coverage)
sonar.coverage.exclusions=\
  src/core/languages/en.ts,\
  src/core/languages/th.ts,\
  src/core/theme/**,\
  src/core/constants/**,\
  src/core/pwa/**,\
  src/vite-env.d.ts,\
  src/**/*.d.ts,\
  src/main.tsx,\
  src/App.tsx,\
  src/app/router/**,\
  src/app/providers/**,\
  src/modules/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.javascript.lcov.reportPaths=lcov.info
sonar.junit.reportPaths=junit-report.xml

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.app.json
